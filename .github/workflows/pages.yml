# Публикация прототипа (папка prototype/) на GitHub Pages.
# Запускается только вручную: Actions → «Опубликовать прототип» → Run workflow.
# Перед первым запуском: Settings → Pages → Source: GitHub Actions.
name: Опубликовать прототип

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
